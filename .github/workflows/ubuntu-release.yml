name: Ubuntu paketi
on:
  workflow_dispatch:
    inputs:
      tag:
        description: GitHub sürüm etiketi
        required: true
        default: v1.1.0

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - run: packaging/build-deb.sh
      - run: gh release upload "$RELEASE_TAG" halka-sayac_*_all.deb
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
