<!doctype html>
<html lang="tr">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Halka Sayaç</title>
<style>
*{box-sizing:border-box} body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0a1420;color:#edf6ff;font:16px system-ui,sans-serif;padding:20px}
main{width:min(100%,420px);padding:28px;background:#142334;border:1px solid #2d4257;border-radius:24px;text-align:center}
h1{font-size:24px;margin:0 0 16px}.dial{position:relative;width:min(100%,268px);margin:auto;aspect-ratio:1;display:grid;place-items:center}
svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}circle{fill:none;stroke-width:8}.track{stroke:#30475c}#ring{stroke:#66e2c3;stroke-linecap:round;stroke-dasharray:100}
#time{font-size:clamp(32px,10vw,52px);font-variant-numeric:tabular-nums}#status{color:#a9bdd0;min-height:1.4em}.row{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:16px}
label{display:grid;gap:5px;color:#bbccdc}input,button{font:inherit;border:1px solid #405b72;border-radius:10px;padding:9px 12px;background:#1e3349;color:inherit}input{width:90px;text-align:center}button{cursor:pointer}button[type=submit]{background:#66e2c3;color:#102a25;border-color:transparent;font-weight:700}
</style>
<main>
<h1>Halka Sayaç</h1>
<div class="dial">
<svg viewBox="0 0 120 120" aria-hidden="true"><circle class="track" cx="60" cy="60" r="53"/><circle id="ring" cx="60" cy="60" r="53" pathLength="100"/></svg>
<output id="time" role="timer" aria-live="off">01:00</output>
</div>
<p id="status" role="status">Hazır</p>
<form id="controls">
<div class="row"><label>Dakika<input id="minutes" type="number" min="0" max="999" value="1" required></label><label>Saniye<input id="seconds" type="number" min="0" max="59" value="0" required></label></div>
<div class="row"><button id="toggle" type="submit">Başlat</button><button id="reset" type="button">Sıfırla</button></div>
</form>
</main>
<script>
'use strict';
const byId = id => document.getElementById(id);
const [time, ring, status, controls, minutes, seconds, toggle, reset] =
  ['time','ring','status','controls','minutes','seconds','toggle','reset'].map(byId);
let total = 60000;
let remaining = total;
let deadline = null;
let interval;
let paused = false;
let sound;
const duration = () => (minutes.valueAsNumber * 60 + seconds.valueAsNumber) * 1000;
const pad = number => String(number).padStart(2, '0');
function render() {
  const whole = Math.ceil(remaining / 1000);
  time.textContent = pad(Math.floor(whole / 60)) + ':' + pad(whole % 60);
  ring.style.strokeDashoffset = total ? 100 * (1 - remaining / total) : 100;
  ring.style.visibility = remaining ? 'visible' : 'hidden';
  document.title = time.textContent + ' · Halka Sayaç';
}
function setRunning(running) {
  minutes.disabled = seconds.disabled = running || paused;
  toggle.textContent = running ? 'Duraklat' : minutes.disabled ? 'Devam et' : 'Başlat';
}
function chime() {
  if (!sound || sound.state !== 'running') return;
  const tone = sound.createOscillator();
  const gain = sound.createGain();
  const now = sound.currentTime;
  tone.frequency.value = 740;
  gain.gain.setValueAtTime(0.18, now);
  gain.gain.exponentialRampToValueAtTime(0.001, now + 0.7);
  tone.connect(gain).connect(sound.destination);
  tone.start(now);
  tone.stop(now + 0.7);
}
function tick() {
  if (deadline === null) return;
  remaining = Math.max(0, deadline - Date.now());
  render();
  if (remaining === 0) {
    clearInterval(interval);
    deadline = null;
    setRunning(false);
    status.textContent = 'Süre doldu!';
    chime();
  }
}
function restore() {
  paused = false;
  clearInterval(interval);
  deadline = null;
  total = remaining = controls.checkValidity() ? duration() : 0;
  setRunning(false);
  status.textContent = 'Hazır';
  render();
}
controls.addEventListener('submit', event => {
  event.preventDefault();
  if (deadline !== null) {
    tick();
    if (deadline === null) return;
    deadline = null;
    clearInterval(interval);
    paused = true;
    setRunning(false);
    status.textContent = 'Duraklatıldı';
    return;
  }
  if (!remaining) total = remaining = duration();
  if (!remaining) {
    status.textContent = 'Süre en az bir saniye olmalı.';
    return;
  }
  try {
    if (!sound) sound = new AudioContext();
    sound.resume().catch(() => {});
  } catch {}
  paused = false;
  deadline = Date.now() + remaining;
  setRunning(true);
  status.textContent = 'Geri sayıyor';
  interval = setInterval(tick, 50);
});
reset.addEventListener('click', restore);
minutes.addEventListener('input', restore);
seconds.addEventListener('input', restore);
document.addEventListener('visibilitychange', tick);
render();
</script>
</html>
